[env:esp01_1m]
platform = espressif8266
board = esp01_1m
framework = arduino
lib_deps = 
	adafruit/Adafruit SSD1306@^2.5.17
	adafruit/Adafruit AHTX0@^2.0.6
	adafruit/ENS160 - Adafruit Fork@^3.0.1
